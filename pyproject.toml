[project]
name = "discrete-math-backend"
version = "0.1.0"
description = "Python backend for Discrete Mathematics learning platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "scipy>=1.11.0",
    "sympy>=1.12",
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    "RestrictedPython>=6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
